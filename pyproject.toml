[project]
name = "pointintime"
version = "0.1.0"
description = "A feature store where point-in-time correctness is enforced, proved by a planted leaking feature the store refuses to serve."
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
